version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    image: battle-arena-web:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/battlearena
      - REDIS_URL=redis://redis:6379
      - AI_PROVIDER=ollama
      - AI_BASE_URL=http://ollama:11434
      - AI_MODEL=qwen3:4b
    depends_on:
      - postgres
      - redis
      - ollama

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    image: battle-arena-worker:latest
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/battlearena
      - REDIS_URL=redis://redis:6379
      - AI_PROVIDER=ollama
      - AI_BASE_URL=http://ollama:11434
    depends_on:
      - postgres
      - redis
      - ollama

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=battlearena
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  redisdata:
  ollamadata:
